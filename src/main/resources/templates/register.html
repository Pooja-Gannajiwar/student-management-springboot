<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Student Registration</title>

</head>
<body class="register-page">
	<div class="background">
	        <span></span>
	        <span></span>
	        <span></span>
	        <span></span>
	    </div>
<div class="container">
<h2>Student Registration</h2>

<form th:action="@{/register}" th:object="${student}" method="post">

    <label>Name:</label>
    <input type="text" th:field="*{name}" required />
    <br><br>

    <label>Roll No:</label>
    <input type="text" th:field="*{rollNo}" required />
    <br><br>

    <label>Branch:</label>
    <input type="text" th:field="*{branch}" required />
    <br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required />
    <br><br>

    <label>Password:</label>
    <input type="password" th:field="*{password}" required />
    <br><br>

    <label>Marks:</label>
    <input type="number" step="0.01" th:field="*{marks}" required />
    <br><br>

    <button type="submit">Register</button>

</form>

<br>
<a th:href="@{/}">Already registered? Login</a>
</div>
</body>
</html>
