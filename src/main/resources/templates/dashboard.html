<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Student Dashboard</title>

</head>
<body class="dashboard-page">
	<div class="background">
	        <span></span>
	        <span></span>
	        <span></span>
	        <span></span>
	    </div>
<div class="container">
<h2>Welcome, <span th:text="${student.name}"></span></h2>

<p><b>Roll No:</b> <span th:text="${student.rollNo}"></span></p>
<p><b>Branch:</b> <span th:text="${student.branch}"></span></p>
<p><b>Email:</b> <span th:text="${student.email}"></span></p>
<p><b>Marks:</b> <span th:text="${student.marks}"></span></p>

<br>
<a th:href="@{/logout}">Logout</a>
</div>
</body>
</html>
